<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - LoveCone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <ul>
            <img class="logo"src="assets/logo4.png" alt="lovecone">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">Sobre</a></li>
            <li><a href="candy.html">Doces</a></li>
            <li><a href="order.html">Pedidos</a></li>
            <li><a href="contact.html">Contato</a></li>
            <img class="logo"src="assets/logo4.png" alt="lovecone">
        </ul>
    </nav>

    <main>
        <section class="order-hero">
            <h1>Faça Seu Pedido</h1>
        </section>

        <form class="order-form" id="orderForm">
            <label for="name">Nome Completo:</label>
            <input type="text" id="name" name="name" required pattern="[A-Za-zÀ-ÿ\s]+" title="Digite apenas letras e espaços">

            <label for="cep">CEP:</label>
<input
    type="text"
    id="cep"
    name="cep"
    maxlength="9"
    placeholder="00000-000"
    required>

<label for="street">Rua:</label>
<input
    type="text"
    id="street"
    name="street"
    placeholder="Digite o nome da rua"
    required>

<label for="number">Número:</label>
<input
    type="text"
    id="number"
    name="number"
    placeholder="123"
    required>

<label for="complement">Complemento:</label>
<input
    type="text"
    id="complement"
    name="complement"
    placeholder="Casa, Apto, Bloco...">

<div class="delivery-row">
    <div class="delivery-label">
        <label>Opção de Entrega:</label>
    </div>
    <div class="delivery-option">
        <label class="radio-option"><input type="radio" name="deliveryOption" value="pickup" checked> Retirada</label>
        <label class="radio-option"><input type="radio" name="deliveryOption" value="delivery"> Entrega</label>
    </div>
</div>



<div id="orderTotalContainer" class="order-total-container">
    <p>Total dos produtos: R$ <strong id="productTotal">0,00</strong></p>
    <p>Total do pedido: R$ <strong id="orderTotal">0,00</strong></p>
</div>

<label for="district">Bairro:</label>
<input
    type="text"
    id="district"
    name="district"
    readonly>

<label for="city">Cidade:</label>
<input
    type="text"
    id="city"
    name="city"
    readonly>

<label for="state">Estado:</label>
<input
    type="text"
    id="state"
    name="state"
    readonly>

<input
    type="hidden"
    id="fullAddress"
    name="fullAddress">

            <label>Produtos:</label>
            <div class="product-options" id="productOptions"></div>

            <label for="date">Data Desejada:</label>
            <input type="date" id="date" name="date" required>

            <label for="message">Mensagem Adicional:</label>
            <textarea id="message" name="message" rows="4" placeholder="adicione informações que desejar"></textarea>

            <button type="submit">Enviar Pedido</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 LoveCone. Todos os direitos reservados.</p>
    </footer>

    <script src="scrip.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=SUA_API_KEY_AQUI&libraries=places&callback=initAutocomplete" async defer></script>
</body>
</html>
